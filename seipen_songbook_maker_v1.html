<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>엄마표 세이펜 송북 만들기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 14px}
h1{font-size:18px;margin:0 0 5px}
.sub{font-size:12px;color:#777}
.wrap{max-width:900px;margin:auto;padding:14px}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}
input,button,select{font:inherit}
input[type=text],input[type=url],input[type=number]{width:100%;border:1px solid #ccc;border-radius:9px;padding:9px;background:#fff}
button{border:0;border-radius:9px;padding:10px 13px;background:#222;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#eee;color:#222}
button.danger{background:#fff0f0;color:#b00020}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:130px}
#items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{border:1px solid #ddd;border-radius:12px;padding:10px;background:#fafafa}
.item.drag{opacity:.5}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#eee;display:block}
.small{font-size:11px;color:#777}
.item .row{margin-top:7px}
.item .row>*{min-width:0}
.item button{padding:8px 10px}
#pages{display:none}
.print-note{font-size:12px;color:#666;line-height:1.5}
@media(max-width:600px){
 #items{grid-template-columns:1fr}
}
@media print{
 @page{size:A5 portrait;margin:0}
 body{background:#fff}
 header,.no-print{display:none!important}
 .wrap{padding:0;max-width:none}
 #editor{display:none!important}
 #pages{display:block!important}
 .page{width:148mm;height:210mm;page-break-after:always;padding:8mm 8mm 7mm;position:relative;overflow:hidden;background:#fff}
 .page:last-child{page-break-after:auto}
 .page-title{font-size:12pt;font-weight:800;height:9mm;display:flex;align-items:center;gap:5mm}
 .page-title:before{content:"♫";font-size:14pt}
 .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:3.2mm 4mm;height:calc(100% - 9mm)}
 .card{min-width:0;min-height:0;display:flex;flex-direction:column}
 .pic-wrap{position:relative;width:100%;height:29mm;overflow:hidden;border-radius:1.8mm;background:#f1f1f1}
 .pic-wrap img{width:100%;height:100%;object-fit:cover;display:block}
 .rec-dot{position:absolute;right:1.5mm;bottom:1.5mm;width:8mm;height:8mm;border-radius:50%;background:#fff;border:0.4mm solid #ddd;font-size:0;box-shadow:0 0.4mm 1mm #9995}
 .rec-dot:after{content:"";display:block;width:5.5mm;height:5.5mm;margin:0.8mm;border-radius:50%;border:0.6mm solid #777}
 .title{font-size:7.2pt;line-height:1.18;font-weight:600;margin-top:1.4mm;height:7.2mm;overflow:hidden}
 .rec{font-size:5.5pt;color:#888;height:4mm;line-height:4mm}
}
</style>
</head>
<body>
<header>
  <h1>엄마표 세이펜 송북 만들기</h1>
  <div class="sub">A5 세로 · 2열 × 4행 · 이미지 자동 배치 · 인쇄/PDF 저장</div>
</header>

<div class="wrap">
<section id="editor" class="panel no-print">
  <label>송북 제목</label>
  <input id="bookTitle" type="text" value="슈퍼윙스 노래 카드">

  <label>자료 추가</label>
  <div class="row">
    <input id="files" type="file" accept="image/*" multiple>
    <button id="addDemo" class="secondary" type="button">예시 8개 만들기</button>
  </div>
  <p class="small">이미지는 기기에서 직접 선택합니다. 유튜브 음원/이미지를 자동 다운로드하지 않습니다.</p>

  <div class="actions">
    <button id="printBtn" type="button">A5 인쇄 / PDF 저장</button>
    <button id="saveBtn" class="secondary" type="button">작업 저장(JSON)</button>
    <button id="loadBtn" class="secondary" type="button">작업 불러오기</button>
    <input id="jsonFile" type="file" accept=".json,application/json" hidden>
  </div>
</section>

<section class="panel no-print">
  <div class="row" style="justify-content:space-between">
    <strong>콘텐츠 <span id="count">0</span>개</strong>
    <div class="actions" style="flex:0 0 auto">
      <button id="clearBtn" class="danger" type="button">전체 삭제</button>
    </div>
  </div>
  <p class="print-note">각 카드의 제목과 REC 번호를 수정할 수 있습니다. 빈칸은 자동으로 페이지가 만들어질 때 건너뜁니다.</p>
  <div id="items"></div>
</section>

<section id="pages"></section>
</div>

<script>
const state={title:"슈퍼윙스 노래 카드",items:[]};
const $=id=>document.getElementById(id);
$("bookTitle").addEventListener("input",e=>{state.title=e.target.value;renderPrint();});

$("files").addEventListener("change", async e=>{
  for(const file of e.target.files){
    const data=await fileToDataURL(file);
    state.items.push({id:crypto.randomUUID(),src:data,title:file.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "),rec:""});
  }
  e.target.value="";
  render();
});

function fileToDataURL(file){
 return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
}

function render(){
 $("count").textContent=state.items.length;
 $("items").innerHTML="";
 state.items.forEach((it,i)=>{
   const el=document.createElement("div"); el.className="item";
   el.draggable=true; el.dataset.index=i;
   el.innerHTML=`
    <img class="thumb" src="${it.src}" alt="">
    <label>제목</label>
    <input type="text" value="${escapeAttr(it.title)}" data-k="title">
    <label>REC 번호</label>
    <input type="text" inputmode="numeric" placeholder="예: 01329" value="${escapeAttr(it.rec)}" data-k="rec">
    <div class="row">
      <button type="button" class="secondary up">↑</button>
      <button type="button" class="secondary down">↓</button>
      <button type="button" class="danger del">삭제</button>
    </div>`;
   el.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",()=>{
      it[inp.dataset.k]=inp.value; renderPrint();
   }));
   el.querySelector(".del").onclick=()=>{state.items.splice(i,1);render()};
   el.querySelector(".up").onclick=()=>{if(i>0){[state.items[i-1],state.items[i]]=[state.items[i],state.items[i-1]];render()}};
   el.querySelector(".down").onclick=()=>{if(i<state.items.length-1){[state.items[i+1],state.items[i]]=[state.items[i],state.items[i+1]];render()}};
   el.addEventListener("dragstart",()=>el.classList.add("drag"));
   el.addEventListener("dragend",()=>el.classList.remove("drag"));
   el.addEventListener("dragover",e=>e.preventDefault());
   el.addEventListener("drop",e=>{
      e.preventDefault(); const from=+el.dataset.index; const to=i;
      if(from!==to){const [x]=state.items.splice(from,1);state.items.splice(to,0,x);render();}
   });
   $("items").appendChild(el);
 });
 renderPrint();
}

function renderPrint(){
 const pages=$("pages"); pages.innerHTML="";
 for(let p=0;p<state.items.length;p+=8){
   const page=document.createElement("div"); page.className="page";
   page.innerHTML=`<div class="page-title">${escapeHtml(state.title)}</div><div class="grid"></div>`;
   const grid=page.querySelector(".grid");
   state.items.slice(p,p+8).forEach(it=>{
      const card=document.createElement("div"); card.className="card";
      card.innerHTML=`<div class="pic-wrap"><img src="${it.src}" alt=""><div class="rec-dot"></div></div>
        <div class="title">${escapeHtml(it.title)}</div><div class="rec">${it.rec?("REC1 "+escapeHtml(it.rec)):""}</div>`;
      grid.appendChild(card);
   });
   pages.appendChild(page);
 }
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}

$("printBtn").onclick=()=>window.print();

$("clearBtn").onclick=()=>{
 if(confirm("모든 콘텐츠를 삭제할까요?")){state.items=[];render();}
};

$("saveBtn").onclick=()=>{
 const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=(state.title||"송북")+".json";a.click();URL.revokeObjectURL(a.href);
};

$("loadBtn").onclick=()=>$("jsonFile").click();
$("jsonFile").onchange=async e=>{
 const f=e.target.files[0]; if(!f)return;
 try{
  const obj=JSON.parse(await f.text());
  state.title=obj.title||"송북";state.items=Array.isArray(obj.items)?obj.items:[];
  $("bookTitle").value=state.title;render();
 }catch(err){alert("올바른 송북 작업 파일이 아닙니다.");}
 e.target.value="";
};

$("addDemo").onclick=()=>{
 const colors=["#ffd9df","#ffe8b6","#fff3b5","#d9f3df","#d8ecff","#e4dcff","#f5d8ee","#dce9e7"];
 state.items=colors.map((c,i)=>({id:crypto.randomUUID(),src:"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450"><rect width="100%" height="100%" fill="${c}"/><text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" font-size="58" font-family="sans-serif" fill="#333">예시 썸네일 ${i+1}</text></svg>`),title:"슈퍼윙스 예시 노래 "+(i+1),rec:"01"+String(329+i)}));
 render();
};
render();
</script>
</body>
</html>
